apiVersion: v1
kind: ServiceAccount
metadata: {name: cfo-backend, namespace: cfo-ai}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: autonomous-cfo-qwen, namespace: my-first-model}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: qwen3-8b-view-role}
subjects:
  - {kind: ServiceAccount, name: cfo-backend, namespace: cfo-ai}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: autonomous-cfo-checks, namespace: autonomous-cfo-guardrails}
rules:
  - apiGroups: [""]
    resources: ["services"]
    # The installed NeMo proxy authorizes a get on services without a resource name.
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: autonomous-cfo-checks, namespace: autonomous-cfo-guardrails}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: autonomous-cfo-checks}
subjects:
  - {kind: ServiceAccount, name: cfo-backend, namespace: cfo-ai}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: cfo-tracking, namespace: cfo-ai}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: mlflow-operator-mlflow-integration}
subjects:
  - {kind: ServiceAccount, name: cfo-backend, namespace: cfo-ai}
