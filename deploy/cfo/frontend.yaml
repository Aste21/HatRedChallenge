apiVersion: v1
kind: Service
metadata: {name: cfo-frontend, namespace: cfo-ai}
spec:
  selector: {app: cfo-frontend}
  ports: [{name: http, port: 8080, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cfo-frontend, namespace: cfo-ai}
spec:
  replicas: 1
  selector: {matchLabels: {app: cfo-frontend}}
  template:
    metadata: {labels: {app: cfo-frontend}}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: image-registry.openshift-image-registry.svc:5000/cfo-ai/cfo-frontend:release
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: HOST, value: "0.0.0.0"}
            - {name: CHAT_API_URL, value: "http://cfo-backend:8080"}
            - {name: NEWS_API_URL, value: "http://news-service.sth.svc:8080"}
            - {name: PROTOCOL_HEADER, value: "x-forwarded-proto"}
            - name: SESSION_SECRET
              valueFrom: {secretKeyRef: {name: cfo-app-session, key: cookie}}
          readinessProbe: {httpGet: {path: /, port: http}, timeoutSeconds: 4}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 512Mi}
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: autonomous-cfo
  namespace: cfo-ai
  annotations: {haproxy.router.openshift.io/timeout: 180s}
spec:
  to: {kind: Service, name: cfo-frontend}
  port: {targetPort: http}
  tls: {termination: edge, insecureEdgeTerminationPolicy: Redirect}
